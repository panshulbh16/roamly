# Temporary: checks the security release (roamly#16) on the live site, then gets removed.
# Public HTTP only, no credentials: harmless requests (a forged payment result that grants nothing,
# an unsigned webhook, page loads).
name: Production check (security release)
on:
  push:
    branches: [claude/modest-planck-igiaoe]
permissions:
  contents: read
jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE: https://heyroamly.com
    steps:
      - name: Live site behaves as released
        run: |
          cat > check.mjs <<'EOF'
          const site = process.env.SITE; let failed = false;
          const check = (name, ok, detail = '') => { console.log(`${ok ? '✓' : '✗'} ${name}${detail ? ' — ' + detail : ''}`); if (!ok) failed = true; };
          const get = (path, headers = {}) => fetch(site + path, { redirect: 'manual', headers });
          let r = await get('/');
          check('live version is the security release', r.headers.get('x-roamly-version')?.startsWith('ba2511a'), r.headers.get('x-roamly-version'));
          check('HTTPS enforced (HSTS)', /max-age=31536000/.test(r.headers.get('strict-transport-security') ?? ''), r.headers.get('strict-transport-security'));
          check('cannot be framed by other sites', r.headers.get('x-frame-options') === 'DENY' && /frame-ancestors 'none'/.test(r.headers.get('content-security-policy') ?? ''));
          r = await get('/api/billing/status', { 'Sec-Fetch-Site': 'none', 'Sec-Fetch-Mode': 'navigate' });
          check('typed-in API address gets 404', r.status === 404 && (await r.text()).includes('Not found'), String(r.status));
          r = await get('/api/trips');
          check('script without the app header gets 404', r.status === 404, String(r.status));
          r = await get('/%61pi/trips');
          check('encoded path cannot slip past', r.status === 404, String(r.status));
          r = await get('/api/billing/status', { 'X-Roamly-Client': 'web', 'Sec-Fetch-Site': 'cross-site' });
          check('another site gets 404 even with the header', r.status === 404, String(r.status));
          r = await get('/api/billing/status', { 'X-Roamly-Client': 'web', 'Sec-Fetch-Site': 'same-origin' });
          check('the app itself reaches the API (then needs sign-in)', r.status === 401, String(r.status));
          r = await fetch(site + '/api/billing/callback', { method: 'POST', redirect: 'manual', headers: { Origin: 'https://api.razorpay.com' }, body: new URLSearchParams({ razorpay_order_id: 'order_check', razorpay_payment_id: 'pay_check', razorpay_signature: '0'.repeat(64) }) });
          check('Razorpay callback still open, forged result refused', r.status === 303 && r.headers.get('location') === site + '/pricing?checkout=unverified', `${r.status} → ${r.headers.get('location')}`);
          r = await fetch(site + '/api/billing/webhook', { method: 'POST', headers: { 'x-razorpay-signature': '0'.repeat(64) }, body: '{}' });
          check('Razorpay webhook still open, unsigned event refused', r.status === 401, String(r.status));
          r = await get('/pricing');
          check('pages load normally', r.status === 200, String(r.status));
          process.exit(failed ? 1 : 0);
          EOF
          node check.mjs

