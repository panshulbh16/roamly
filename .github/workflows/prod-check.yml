# Temporary: confirms the live site reads encrypted data back (public trip list; prints counts only), then gets removed.
name: Production check (decrypt)
on:
  push:
    branches: [claude/modest-planck-igiaoe]
permissions:
  contents: read
jobs:
  decrypt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Public trip list decrypts
        run: |
          cat > check.mjs <<'EOF'
          const r = await fetch('https://heyroamly.com/api/together?city=&destination=', { headers: { 'X-Roamly-Client': 'web' } });
          const body = await r.json().catch(() => ({}));
          const trips = body.trips ?? [];
          const readable = trips.filter(t => typeof t.title === 'string' && t.title && !t.title.startsWith('enc1:')).length;
          console.log(`status ${r.status}; ${trips.length} published trips listed; ${readable} with readable titles`);
          process.exit(r.status === 200 && readable === trips.length ? 0 : 1);
          EOF
          node check.mjs
