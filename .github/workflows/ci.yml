name: Roamly CI/CD
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: python3 tests/storage_test.py

  # Every test on both OSes must pass before anything reaches production.
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://roamly.panshulbh16.workers.dev
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: c429b2fc4f62d2414c880d87fce53206
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
      - run: npm ci
      - name: Apply new database migrations
        run: npx wrangler d1 migrations apply roamly-db --remote -c wrangler.jsonc
      - run: npm run build
      - name: Deploy to Cloudflare
        run: npx wrangler deploy --keep-vars --var GIT_SHA:${{ github.sha }}
      - name: Verify the new version is live and served fresh
        run: bash scripts/verify-deploy.sh https://roamly.panshulbh16.workers.dev ${{ github.sha }}
