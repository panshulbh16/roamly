# Temporary: checks the Plus payment redirect on the live site after roamly#15 deployed.
# Sends only harmless requests (forged/declined payment results that grant nothing, page loads).
name: Production smoke test (Plus redirect)
on:
  push:
    branches: [claude/modest-planck-igiaoe]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE: https://heyroamly.com
      EXPECTED_SHA: be810f5310b15c751c130d01cd7f846461e3a29d
    steps:
      - name: Wait until the fix is the live version
        run: |
          for i in $(seq 1 50); do
            live=$(curl -sS -o /dev/null -D - "$SITE/" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-roamly-version"{print $2}')
            echo "live version: ${live:-unknown}"
            [ "$live" = "$EXPECTED_SHA" ] && exit 0
            sleep 15
          done
          echo "::error::$EXPECTED_SHA never went live"; exit 1
      - name: Check the payment return path on production
        run: |
          cat > smoke.mjs <<'EOF'
          const site = process.env.SITE;
          let failed = false;
          const check = (name, ok, detail = '') => { console.log(`${ok ? '✓' : '✗'} ${name}${detail ? ' — ' + detail : ''}`); if (!ok) failed = true; };
          const post = (path, body, headers = {}) => fetch(site + path, { method: 'POST', redirect: 'manual', headers: { Origin: 'https://api.razorpay.com', ...headers }, body });
          const back = r => `${r.status} → ${r.headers.get('location')}`;

          // Razorpay posts the checkout result cross-site; the server must answer with a redirect back to /pricing.
          let r = await post('/api/billing/callback', new URLSearchParams({ razorpay_order_id: 'order_smoketest', razorpay_payment_id: 'pay_smoketest', razorpay_signature: '0'.repeat(64) }));
          check('forged payment result: rejected, buyer sent back', r.status === 303 && r.headers.get('location') === site + '/pricing?checkout=unverified', back(r));
          r = await post('/api/billing/callback', new URLSearchParams({ 'error[code]': 'BAD_REQUEST_ERROR', 'error[description]': 'Payment failed', 'error[metadata]': '{}' }));
          check('declined payment: buyer sent back as failed', r.status === 303 && r.headers.get('location') === site + '/pricing?checkout=failed', back(r));
          r = await post('/api/billing/callback', '{}', { 'Content-Type': 'application/json' });
          check('malformed post: rejected, buyer sent back', r.status === 303 && r.headers.get('location') === site + '/pricing?checkout=unverified', back(r));
          for (const host of ['https://www.heyroamly.com', 'https://roamly.panshulbh16.workers.dev']) {
            const o = await fetch(host + '/api/billing/callback', { method: 'POST', redirect: 'manual', headers: { Origin: 'https://api.razorpay.com' }, body: new URLSearchParams({ razorpay_order_id: 'order_smoketest' }) });
            check(`callback also answers on ${new URL(host).host}`, o.status === 303 && (o.headers.get('location') ?? '').endsWith('/pricing?checkout=unverified'), back(o));
          }

          // Every place the buyer can land renders.
          for (const outcome of ['activated', 'failed', 'unverified', 'pending']) {
            r = await fetch(site + '/pricing?checkout=' + outcome);
            check(`/pricing?checkout=${outcome} renders`, r.status === 200 && (r.headers.get('content-type') ?? '').startsWith('text/html'), String(r.status));
          }

          // The live checkout code hands Razorpay the callback URL in redirect mode (crawl the served JS chunks).
          const seen = new Set(), queue = [];
          const add = u => { const url = new URL(u, site); if (url.origin === site && url.pathname.endsWith('.js') && !seen.has(url.href)) { seen.add(url.href); queue.push(url.href); } };
          try { const m = await (await fetch(site + '/.vite/manifest.json')).json(); for (const e of Object.values(m)) if (e.file) add('/' + e.file); } catch {}
          const html = await (await fetch(site + '/pricing')).text();
          for (const [, u] of html.matchAll(/["'](\/assets\/[\w.-]+\.js)["']/g)) add(u);
          let checkout = null;
          while (queue.length && seen.size < 400 && !checkout) {
            const url = queue.shift(), code = await (await fetch(url)).text();
            if (code.includes('/api/billing/callback')) checkout = { url, code };
            for (const [, u] of code.matchAll(/["'`]((?:\.{1,2}\/|\/assets\/)[\w./-]+\.js)["'`]/g)) add(new URL(u, url).href);
          }
          check('live checkout sends callback_url in redirect mode', !!checkout && /callback_url:[^,]{0,80}["'`]\/api\/billing\/callback["'`],redirect:(!0|true)/.test(checkout.code), checkout ? new URL(checkout.url).pathname : `not found in ${seen.size} chunks`);

          // The webhook backstop is still live and still verifying signatures.
          r = await post('/api/billing/webhook', '{}', { 'x-razorpay-signature': '0'.repeat(64) });
          check('webhook backstop rejects unsigned events', r.status === 401, String(r.status));
          // The old JSON confirm endpoint is gone.
          r = await post('/api/billing/confirm', '{}', { 'Content-Type': 'application/json', Origin: site });
          console.log(`ℹ old /api/billing/confirm now answers ${r.status}`);
          process.exit(failed ? 1 : 0);
          EOF
          node smoke.mjs
