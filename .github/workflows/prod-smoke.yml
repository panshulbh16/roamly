# Temporary: a US visitor signs in on the live site and opens checkout (GitHub's runners are in the US). Nothing is paid.
# Removed right after.
name: Production check (dollar checkout)
on:
  push:
    branches: [claude/modest-planck-igiaoe]
permissions:
  contents: read
jobs:
  abroad-checkout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install a browser
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i --silent playwright@1
          npx playwright install --with-deps chromium >/dev/null
      - name: Open checkout as a US buyer
        run: |
          echo "Cloudflare sees this runner in: $(curl -sS https://heyroamly.com/cdn-cgi/trace | grep '^loc=' | cut -d= -f2)"
          NODE_PATH=/tmp/pw/node_modules node .github/prod-checkout-check.cjs
